[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaokey"
version = "0.1.1"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "dbus-next>=0.2.3,<1; sys_platform == 'linux'",
]

[project.scripts]
kaokey = "kaokey.main:main"

[tool.setuptools.package-data]
"kaokey.resources" = ["data/*.json", "icons/*.ico", "translations/*.qm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"


[tool.rope]
source_folders = ["src"]

ignored_resources = [
    "*.pyc",
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".ropeproject",
    "build",
    "dist",
]

save_history = true
max_history_items = 100
